<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#1f6f5c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Budget">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <title>Budget</title>
  <style>
    :root {
      --bg: #f4f4f1; --card: #ffffff; --text: #1c1c1a; --muted: #6b6b66; --line: #e3e3de;
      --accent: #1f6f5c; --ok: #1f6f5c; --warn: #b36b00; --bad: #b3261e; --btn: #1f6f5c; --btn-text: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #000000; --card: #1c1c1e; --text: #f2f2f0; --muted: #9a9a95; --line: #2c2c2e;
        --accent: #5fd0b0; --ok: #5fd0b0; --warn: #f0b24a; --bad: #ff7a70; --btn: #5fd0b0; --btn-text: #06241c;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: max(16px, env(safe-area-inset-top)) 16px max(32px, env(safe-area-inset-bottom));
    }
    main { max-width: 560px; margin: 0 auto; display: grid; gap: 14px; }
    h1 { font-size: 20px; margin: 0; }
    h2 { font-size: 13px; margin: 0 0 10px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
    .sub { color: var(--muted); font-size: 14px; }
    .hero { font-size: 40px; font-weight: 700; letter-spacing: -.02em; margin: 2px 0; }
    .row { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; border-top: 1px solid var(--line); font-size: 15px; }
    .row:first-of-type { border-top: 0; }
    .row span:last-child { font-variant-numeric: tabular-nums; white-space: nowrap; }
    .badge { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 13px; font-weight: 600; border: 1px solid currentColor; }
    .ok { color: var(--ok); } .over-base, .near-ceiling { color: var(--warn); } .over-ceiling, .bad { color: var(--bad); }
    .banner { border-color: var(--warn); }
    .banner.bad { border-color: var(--bad); }
    form { display: grid; gap: 8px; margin-top: 12px; grid-template-columns: 1fr 1fr; }
    form .wide { grid-column: 1 / -1; }
    input { font: inherit; padding: 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--text); width: 100%; min-width: 0; }
    button { font: inherit; font-weight: 600; padding: 10px 14px; border-radius: 10px; border: 0; background: var(--btn); color: var(--btn-text); cursor: pointer; }
    button.ghost { background: transparent; color: var(--accent); border: 1px solid var(--line); }
    button.x { background: transparent; color: var(--muted); padding: 0 6px; font-size: 18px; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
    label.file { display: inline-block; }
    label.file input { display: none; }
    label.file span { display: inline-block; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--line); color: var(--accent); font-weight: 600; cursor: pointer; }
    .empty { color: var(--muted); font-size: 14px; padding: 6px 0; }
  </style>
</head>
<body>
  <main id="app"><p class="sub">Loading...</p></main>
  <script type="module" src="./app.js"></script>
</body>
</html>
