<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ededea">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f0f0f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Budget">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <script>
    // Apply the saved Light / Dark choice before the page draws, so it never flashes the other theme.
    try {
      // Light by default; Dark and System are choices in Settings.
      const t = localStorage.getItem('budget-theme') || 'light';
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    } catch { document.documentElement.dataset.theme = 'light'; }
  </script>
  <link rel="preload" href="fonts/urbanist-latin-wght.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
  <title>Budget</title>
</head>
<body>
  <main id="view"><p class="sub">Loading...</p></main>
  <nav id="tabs" aria-label="Main"></nav>
  <div id="sheets"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <div id="dialog"></div>
  <script type="module" src="./app.js"></script>
</body>
</html>
